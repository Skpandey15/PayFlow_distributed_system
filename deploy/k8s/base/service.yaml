apiVersion: v1
kind: Service
metadata:
  name: payflow
  labels:
    app.kubernetes.io/name: payflow
spec:
  selector:
    app.kubernetes.io/name: payflow
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Voluntary disruptions (node drains, upgrades) never take the last serving replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payflow
