# Default deny for the namespace, then only the flows PayFlow needs (Zero Trust at the network layer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payflow
  policyTypes: [Ingress, Egress]
  ingress:
    # API only from the ingress controller; the metrics scrape only from the observability namespace.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress}
      ports: [{port: 8080}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports: [{port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: payflow-data}
      ports: [{port: 5432}, {port: 9092}, {port: 27017}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports: [{port: 4318}]
    # IdP (JWKS) and settlement rails are external HTTPS endpoints.
    - ports: [{port: 443}]
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
