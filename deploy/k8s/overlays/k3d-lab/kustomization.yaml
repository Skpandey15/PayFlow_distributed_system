# Local k3d lab. The k3d cluster joins the docker-compose network (payflow_default), and the platform services
# (PostgreSQL, Kafka, MongoDB, Keycloak, Tempo) are the compose containers, reached by their compose names through
# hostAliases that deploy.sh generates from the live container IPs (pod DNS cannot resolve Docker's embedded DNS).
# One replica; run it with the compose `payflow` container stopped so there is only one set of consumers.
#   ENV_FILE=.env deploy/k8s/overlays/k3d-lab/deploy.sh
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payflow
resources:
  - ../../base
  - rail-simulator.yaml
  - lab-egress.yaml
patches:
  - target: {kind: Deployment, name: payflow}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: HorizontalPodAutoscaler, name: payflow}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: {kind: ConfigMap, name: payflow-config}
    patch: |-
      - op: replace
        path: /data/PAYFLOW_DB_URL
        value: jdbc:postgresql://postgres:5432/payflow
      - op: replace
        path: /data/PAYFLOW_KAFKA_BOOTSTRAP_SERVERS
        value: kafka:29092
      - op: replace
        path: /data/PAYFLOW_JWT_ISSUER
        value: http://localhost:8081/realms/payflow
      - op: replace
        path: /data/PAYFLOW_SECURITY_JWT_JWK_SET_URI
        value: http://keycloak:8081/realms/payflow/protocol/openid-connect/certs
      - op: replace
        path: /data/PAYFLOW_SETTLEMENT_RAIL_URL
        value: http://rail-simulator:8090
      - op: replace
        path: /data/PAYFLOW_KAFKA_REPLICATION_FACTOR
        value: "1"
      - op: replace
        path: /data/PAYFLOW_OTLP_TRACES_ENDPOINT
        value: http://tempo:4318/v1/traces
