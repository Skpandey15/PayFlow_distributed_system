# Actionable alerts only (docs/sre/ALERTS.md). severity=page wakes someone; severity=ticket is handled in working
# hours. Every alert carries its runbook. Transient single failures never alert: durations and burn rates filter them.
groups:
  - name: payflow-slo-burn
    rules:
      # Multi-window, multi-burn-rate (SLO 99.9% => budget 0.1%). 14.4x burns 2% of a 30-day budget in 1 hour.
      - alert: PaymentAcceptanceBudgetFastBurn
        expr: payflow:acceptance_errors:ratio_rate1h > (14.4 * 0.001) and payflow:acceptance_errors:ratio_rate5m > (14.4 * 0.001)
        labels: {severity: page, slo: acceptance-availability}
        annotations:
          summary: "Payment acceptance is failing fast enough to exhaust the monthly error budget in ~2 days"
          runbook: docs/sre/RUNBOOKS.md#error-budget-burn
      - alert: PaymentAcceptanceBudgetSlowBurn
        expr: payflow:acceptance_errors:ratio_rate6h > (6 * 0.001) and payflow:acceptance_errors:ratio_rate30m > (6 * 0.001)
        labels: {severity: page, slo: acceptance-availability}
        annotations:
          summary: "Sustained payment acceptance errors (6x budget burn over 6h)"
          runbook: docs/sre/RUNBOOKS.md#error-budget-burn
      - alert: PaymentAcceptanceLatencyBudgetBurn
        # SLO: 99% under 300 ms => 1% budget of slow requests.
        expr: payflow:acceptance_slow:ratio_rate1h > (6 * 0.01) and payflow:acceptance_slow:ratio_rate5m > (6 * 0.01)
        labels: {severity: page, slo: acceptance-latency}
        annotations:
          summary: "More than 6% of payment acceptances exceed 300 ms (p99 SLO burning 6x)"
          runbook: docs/sre/RUNBOOKS.md#high-p99-latency
      - alert: PaymentCompletionSlow
        expr: payflow:completion_slow:ratio_rate30m > 0.05
        for: 10m
        labels: {severity: page, slo: completion-latency}
        annotations:
          summary: "More than 5% of payments take longer than 30 s to complete (SLO: 1%)"
          runbook: docs/sre/RUNBOOKS.md#high-p99-latency

  - name: payflow-pipeline
    rules:
      - alert: OutboxPublicationLagging
        expr: max(payflow_outbox_oldest_age_seconds) > 15
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "Oldest unpublished event is {{ $value }}s old (publication SLI target 5 s)"
          runbook: docs/sre/RUNBOOKS.md#outbox-backlog
      - alert: OutboxPublicationStalled
        # At 60 s admission control starts refusing new payments (503): customer impact has begun.
        expr: max(payflow_outbox_oldest_age_seconds) > 60
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Outbox publication stalled; payment intake is being shed"
          runbook: docs/sre/RUNBOOKS.md#outbox-backlog
      - alert: KafkaConsumerLagGrowing
        expr: |
          max by (group, topic) (payflow_kafka_consumer_lag_records{topic!~".*-(retry|dlt).*"}) > 1000
          and max by (group, topic) (deriv(payflow_kafka_consumer_lag_records{topic!~".*-(retry|dlt).*"}[10m])) > 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.group }} is falling behind on {{ $labels.topic }} ({{ $value }} records)"
          runbook: docs/sre/RUNBOOKS.md#high-kafka-lag
      - alert: ConsumerLagMonitorStale
        expr: time() - max(payflow_kafka_lag_monitor_last_success_seconds) > 120
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Consumer-lag numbers are stale (broker unreachable from PayFlow?)"
          runbook: docs/sre/RUNBOOKS.md#high-kafka-lag
      - alert: DeadLettersAppearing
        expr: sum(increase(payflow_events_dead_lettered_total[15m])) > 0
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} messages dead-lettered in 15 min"
          runbook: docs/sre/RUNBOOKS.md#dlt-spike
      - alert: DeadLetterSpike
        expr: sum(increase(payflow_events_dead_lettered_total[15m])) > 20
        labels: {severity: page}
        annotations:
          summary: "Dead-letter spike: {{ $value }} messages in 15 min"
          runbook: docs/sre/RUNBOOKS.md#dlt-spike

  - name: payflow-workflow
    rules:
      - alert: SagaStuck
        # 300 s = more than twice the longest step timeout except settlement; recovery should have acted.
        expr: max by (step) (payflow_saga_oldest_age_seconds{step=~"AWAITING_RISK|AWAITING_FUNDS|AWAITING_CAPTURE|COMPENSATING"}) > 300
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Oldest saga in {{ $labels.step }} is {{ $value }}s old"
          runbook: docs/sre/RUNBOOKS.md#saga-stuck
      - alert: SettlementStepStuck
        expr: max(payflow_saga_oldest_age_seconds{step="AWAITING_SETTLEMENT"}) > 900
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "A payment has waited {{ $value }}s for settlement"
          runbook: docs/sre/RUNBOOKS.md#saga-stuck
      - alert: SagaRecoveryHeld
        expr: sum(increase(payflow_saga_recovery_held_total[10m])) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Saga recovery is holding because commands are not being published (symptom of an outbox backlog)"
          runbook: docs/sre/RUNBOOKS.md#outbox-backlog
      - alert: ManualReviewWaiting
        expr: max(payflow_saga_open{step="MANUAL_REVIEW"}) > 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} payments await manual review (funds held)"
          runbook: docs/sre/RUNBOOKS.md#manual-review
      - alert: ManualReviewAging
        expr: max(payflow_saga_oldest_age_seconds{step="MANUAL_REVIEW"}) > 14400
        labels: {severity: page}
        annotations:
          summary: "A manual-review case is older than 4 hours (customer funds held)"
          runbook: docs/sre/RUNBOOKS.md#manual-review

  - name: payflow-money
    rules:
      - alert: ReconciliationCriticalMismatch
        # Confirmed = seen in two consecutive runs, so in-flight events never page anyone.
        expr: sum(payflow_reconciliation_mismatches_open{severity="CRITICAL",confirmed="true"}) > 0
        labels: {severity: page}
        annotations:
          summary: "Financial drift confirmed: {{ $value }} CRITICAL mismatch(es)"
          runbook: docs/sre/RUNBOOKS.md#reconciliation-mismatch
      - alert: ReconciliationHighMismatch
        expr: sum(payflow_reconciliation_mismatches_open{severity="HIGH",confirmed="true"}) > 0
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} HIGH reconciliation mismatch(es) open (missing posting or funds still held)"
          runbook: docs/sre/RUNBOOKS.md#reconciliation-mismatch
      - alert: ReconciliationNotRunning
        expr: sum(increase(payflow_reconciliation_runs_total{result="OK"}[30m])) == 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "No successful reconciliation run in 30 minutes: drift would go undetected"
          runbook: docs/sre/RUNBOOKS.md#reconciliation-mismatch

  - name: payflow-dependencies
    rules:
      - alert: SettlementCircuitOpen
        expr: max by (name) (resilience4j_circuitbreaker_state{state="open"}) == 1
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.name }} circuit open: settlements for that rail are failing fast and queueing in retries"
          runbook: docs/sre/RUNBOOKS.md#circuit-breaker-open
      - alert: SettlementCircuitOpenProlonged
        expr: max by (name) (resilience4j_circuitbreaker_state{state="open"}) == 1
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.name }} circuit open for 15 min: payments will escalate to manual review"
          runbook: docs/sre/RUNBOOKS.md#circuit-breaker-open
      - alert: DatabasePoolSaturated
        expr: max(hikaricp_connections_pending) > 0 and max(hikaricp_connections_active / hikaricp_connections_max) > 0.9
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Threads are queueing for database connections"
          runbook: docs/sre/RUNBOOKS.md#database-pool-saturation
      - alert: JvmGcOverhead
        expr: sum(rate(jvm_gc_pause_seconds_sum[5m])) > 0.1
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "More than 10% of wall time spent in GC pauses"
          runbook: docs/sre/RUNBOOKS.md#high-p99-latency
      - alert: PayFlowTargetDown
        expr: up{job="payflow"} == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Prometheus cannot scrape PayFlow (instance down or scrape token rejected)"
          runbook: docs/sre/RUNBOOKS.md#error-budget-burn
