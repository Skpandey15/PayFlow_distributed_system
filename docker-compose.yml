# Local runtime: PayFlow + PostgreSQL + MongoDB + Kafka (KRaft) + Keycloak (OIDC identity provider).
#   cp .env.example .env   # then set every password
#   docker compose up --build
# Secrets come only from .env (git-ignored). Nothing secret is committed.
name: payflow

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      # Consumed by deploy/postgres/init to create the least-privilege roles.
      PAYFLOW_DB_MIGRATION_PASSWORD: ${PAYFLOW_DB_MIGRATION_PASSWORD:?set PAYFLOW_DB_MIGRATION_PASSWORD in .env}
      PAYFLOW_DB_PASSWORD: ${PAYFLOW_DB_PASSWORD:?set PAYFLOW_DB_PASSWORD in .env}
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${PAYFLOW_PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d payflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: payflow_fraud
      # Consumed by deploy/mongo/init to create the application user (readWrite on payflow_fraud only).
      PAYFLOW_MONGO_PASSWORD: ${PAYFLOW_MONGO_PASSWORD:?set PAYFLOW_MONGO_PASSWORD in .env}
    volumes:
      - ./deploy/mongo/init:/docker-entrypoint-initdb.d:ro
      - mongodata:/data/db
    ports:
      - "127.0.0.1:${PAYFLOW_MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # Single-node KRaft (no ZooKeeper). Production: 3+ brokers, RF=3, min.insync.replicas=2, SASL/mTLS + ACLs
    # (see deploy/kafka/acl-matrix.sh and docs/architecture/ZERO-TRUST.md).
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${PAYFLOW_KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the application (partitions, retention); never created by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${PAYFLOW_KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Tokens always carry iss=http://localhost:<port>/realms/payflow; the API validates exactly that issuer.
      KC_HOSTNAME: http://localhost:${PAYFLOW_KEYCLOAK_HOST_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Resolved by the realm import (placeholders in deploy/keycloak/realm-payflow.json).
      PAYFLOW_TREASURY_CLIENT_SECRET: ${PAYFLOW_TREASURY_CLIENT_SECRET:?set in .env}
      PAYFLOW_OPS_CLIENT_SECRET: ${PAYFLOW_OPS_CLIENT_SECRET:?set in .env}
      PAYFLOW_DEMO_USER_PASSWORD: ${PAYFLOW_DEMO_USER_PASSWORD:?set in .env}
    volumes:
      - ./deploy/keycloak/realm-payflow.json:/opt/keycloak/data/import/realm-payflow.json:ro
    ports:
      - "127.0.0.1:${PAYFLOW_KEYCLOAK_HOST_PORT:-8081}:8081"

  payflow:
    build: .
    image: payflow:wp01
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      PAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/payflow
      PAYFLOW_DB_USER: payflow_app
      PAYFLOW_DB_PASSWORD: ${PAYFLOW_DB_PASSWORD}
      SPRING_FLYWAY_USER: payflow_migrator
      SPRING_FLYWAY_PASSWORD: ${PAYFLOW_DB_MIGRATION_PASSWORD}
      PAYFLOW_MONGO_URI: mongodb://payflow_fraud_app:${PAYFLOW_MONGO_PASSWORD}@mongo:27017/payflow_fraud?authSource=payflow_fraud
      PAYFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYFLOW_JWT_ISSUER: http://localhost:${PAYFLOW_KEYCLOAK_HOST_PORT:-8081}/realms/payflow
      PAYFLOW_SECURITY_JWT_JWK_SET_URI: http://keycloak:8081/realms/payflow/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:${PAYFLOW_API_HOST_PORT:-8080}:8080"
    # Container hardening: immutable root filesystem, no privilege escalation, no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
  mongodata:
  kafkadata:
