# PayFlow WP-01 runtime configuration.
# Rule: no secrets in this file. Credentials come from the environment (Kubernetes Secret / Vault in later WPs).
spring:
  application:
    name: payflow
  threads:
    virtual:
      # Request handling on virtual threads. The DB connection pool, not the thread pool, is the concurrency
      # bulkhead for database work (see WP-01-LLD, "Scalability").
      enabled: true
  datasource:
    url: ${PAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/payflow}
    # Runtime role: DML only (see R__runtime_role_grants.sql).
    username: ${PAYFLOW_DB_USER:payflow_app}
    password: ${PAYFLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PAYFLOW_DB_POOL_SIZE:20}
      # Fail fast when the pool is exhausted instead of queueing requests for 30s.
      connection-timeout: 3000
  jpa:
    # No lazy-loading from controllers and no transactions stretched over the whole HTTP request.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate only verifies that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # In deployed environments migrations run as the schema-OWNER role, separate from the runtime role
    # (least privilege): set SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD (see docker-compose.yml).
    # When unset, Flyway reuses the application datasource (single-user test databases).
    placeholders:
      runtime_role: ${PAYFLOW_DB_RUNTIME_ROLE:payflow_app}
  mongodb:
    uri: ${PAYFLOW_MONGO_URI:mongodb://localhost:27017/payflow_fraud}
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${PAYFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: payflow
    producer:
      # Durability: the broker acknowledges only after all in-sync replicas have the record.
      acks: all
      properties:
        # Idempotent producer: broker-side dedup of producer retries; keeps per-partition order with up to 5 in flight.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Fail fast when the broker is unreachable; the outbox keeps the event and the relay retries later.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
        linger.ms: 5
    consumer:
      # Offsets are committed by the container after the listener returns (after the DB commit), never on a timer.
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
      isolation-level: read_committed
      properties:
        # Incremental rebalancing: a joining/leaving instance does not stop every consumer in the group.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      # Commit each record's offset after it was processed successfully (or routed to retry/DLT).
      ack-mode: record
      # Per listener container. Rule: replicas x concurrency <= partitions (6); extra consumers idle (WP-03 F-15).
      concurrency: ${PAYFLOW_KAFKA_LISTENER_CONCURRENCY:3}
      # Continues the W3C trace from the traceparent header that the outbox stored.
      observation-enabled: true
      missing-topics-fatal: false
    template:
      # The relay sets the traceparent captured at outbox-write time; template observation would overwrite it.
      observation-enabled: false
  task:
    scheduling:
      pool:
        size: 4
      # Graceful shutdown: let an in-progress relay batch or recovery run finish (it is bounded by the relay's send
      # timeout), instead of interrupting it mid-batch. Rows not yet marked are simply re-sent by the next owner.
      shutdown:
        await-termination: true
        await-termination-period: 15s
  lifecycle:
    # Per shutdown phase (web server drain, then listeners and schedulers). Sum stays inside the Kubernetes
    # terminationGracePeriodSeconds (45s) after the preStop delay (10s).
    timeout-per-shutdown-phase: 25s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # metrics and prometheus require scope ops:metrics. Prometheus scrapes with a client-credentials token
        # (payflow-monitoring client), so the scrape path is authenticated like every other caller.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Readiness = "can serve payments": PostgreSQL is required. MongoDB is deliberately excluded. A fraud-store
        # outage degrades authorization (fail closed, 503) but must not pull every pod out of the load balancer,
        # which would also take down reads and payment creation.
        readiness:
          include: readinessState,db
        # Liveness never checks dependencies: a DB outage must not cause a restart storm.
        liveness:
          include: livenessState
  tracing:
    sampling:
      # Head sampling. Trace context (traceId in logs, traceparent on events) is propagated for EVERY request
      # regardless; sampling only decides which spans are exported. Load tests run at 0.1.
      probability: ${PAYFLOW_TRACE_SAMPLING:1.0}
    export:
      enabled: ${PAYFLOW_TRACE_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP/HTTP to Tempo (docker-compose observability profile) or an OpenTelemetry Collector.
          endpoint: ${PAYFLOW_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: 5s
  otlp:
    metrics:
      export:
        # One metrics pipeline: Prometheus pulls /actuator/prometheus. The OpenTelemetry starter would otherwise also
        # push OTLP metrics every minute to a collector that does not exist (found in WP-03: failing background export).
        enabled: false
  metrics:
    tags:
      application: payflow
    distribution:
      # Percentile histograms (Prometheus buckets) only for the latency SLIs, so p50/p95/p99 are computed in PromQL
      # across replicas. Client-side percentiles cannot be aggregated and are not used.
      percentiles-histogram:
        http.server.requests: true
        payflow.saga: true
        payflow.outbox.publish.delay: true
        payflow.outbox.send.latency: true
        payflow.events.processing: true
      # Exact SLO thresholds as bucket boundaries, so "share of requests under the target" is exact (SLI-SLO.md).
      slo:
        http.server.requests: 100ms,300ms,1s
        payflow.saga.completion: 5s,10s,30s,60s
        payflow.outbox.publish.delay: 1s,5s,15s
      minimum-expected-value:
        http.server.requests: 1ms
        payflow: 1ms
      maximum-expected-value:
        http.server.requests: 10s
        payflow.saga: 10m
        payflow.outbox.publish.delay: 10m
        payflow.outbox.send.latency: 30s
        payflow.events.processing: 30s

# JDBC spans (datasource-micrometer). Connection spans expose pool-acquisition waits inside a trace; query spans show
# statement time. Parameter values are never recorded: they carry amounts and account ids.
jdbc:
  includes: CONNECTION, QUERY
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false

logging:
  level:
    # Hibernate logs every SQL error at ERROR before rethrowing. Unique violations are EXPECTED control flow here
    # (idempotency, settlement and ledger races) and are translated by the adapters. Real failures propagate and are
    # logged once at the API boundary, so this avoids double-logging and alert fatigue.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

payflow:
  security:
    jwt:
      issuer: ${PAYFLOW_JWT_ISSUER:}
      audience: ${PAYFLOW_JWT_AUDIENCE:payflow-api}
      # payflow.security.jwt.jwk-set-uri is intentionally not defaulted: without it no JwtDecoder exists and
      # the application refuses to start (fail closed). Set PAYFLOW_SECURITY_JWT_JWK_SET_URI.
  traffic:
    # Edge overload control (RESILIENCE-ARCHITECTURE.md). Experiments override via environment, never silently.
    payments-per-subject-per-second: ${PAYFLOW_RATE_LIMIT_PAYMENTS_PER_SUBJECT:20}
    ops-per-subject-per-minute: 10
    admission-max-outbox-age: ${PAYFLOW_ADMISSION_MAX_OUTBOX_AGE:60s}
    admission-retry-after: 30s
    # In-flight bulkhead on payment acceptance (0 = off). Value from the WP-03 stress experiment (TUNING-RESULTS.md).
    max-concurrent-payment-requests: ${PAYFLOW_MAX_CONCURRENT_PAYMENT_REQUESTS:48}
    # Shed intake while any group is this far behind on a main topic. Tested 1,000 (TUNING-RESULTS §9): threshold
    # admission on a sampled, lagging signal oscillates (admit a burst, close, drain, reopen) and raised burst
    # acceptance p99 268 -> 1,484 ms for completion p99 136 -> 90 s. Rejected; the real fix is adaptive concurrency.
    admission-max-consumer-lag: ${PAYFLOW_ADMISSION_MAX_CONSUMER_LAG:5000}
  persistence:
    transaction-timeout: 5s
  messaging:
    topic:
      partitions: ${PAYFLOW_KAFKA_PARTITIONS:6}
      # Production: 3 (with min.insync.replicas=2, acks=all). Local single broker: 1.
      replication-factor: ${PAYFLOW_KAFKA_REPLICATION_FACTOR:1}
      retention: 7d
    outbox:
      poll-interval-ms: 200
      batch-size: 100
      send-timeout: 5s
      relay-transaction-timeout: 30s
      # Published rows are diagnostics only (the event is on Kafka for 7 d). 7 d here grew the payment outbox to
      # 3.6 M rows / 3.8 GB in the lab and slowed the database (TUNING-RESULTS §3). Production: partition by hour
      # and drop partitions instead of DELETE (CAPACITY-PLAN).
      retention: ${PAYFLOW_OUTBOX_RETENTION:1h}
      purge-interval-ms: 300000
      # WP-03 (ADR-019). WP-02 behaviour for A/B measurement: pipelined=false, drain-budget=0s.
      pipelined: ${PAYFLOW_OUTBOX_PIPELINED:true}
      drain-budget: ${PAYFLOW_OUTBOX_DRAIN_BUDGET:1s}
    inbox:
      # Deduplication window: must exceed Kafka topic retention (7 d) + DLT replay window (InboxPurgeJob).
      retention: 8d
      purge-interval-ms: 3600000
    # Broker-side lag sampling; also the admission-control signal, so it must be fresher than the lag it guards.
    lag-monitor-interval-ms: 5000
    retry:
      # 1 original + 3 retries at 1s, 3s, 9s (non-blocking retry topics), then the dead-letter topic.
      attempts: 4
      initial-delay-ms: 1000
      multiplier: 3
      max-delay-ms: 30000
  saga:
    risk-timeout: 30s
    funds-timeout: 30s
    settlement-timeout: 2m
    capture-timeout: 30s
    compensation-timeout: 30s
    max-step-attempts: 3
    recovery-interval-ms: 10000
  settlement:
    rail:
      # External settlement rails (the lab rail simulator). Policy values are derived in RESILIENCE-ARCHITECTURE.md.
      base-url: ${PAYFLOW_SETTLEMENT_RAIL_URL:http://localhost:8090}
      connect-timeout: 500ms
      submit-timeout: 2s
      inquiry-timeout: 1s
      retry:
        max-attempts: 2
        initial-backoff: 200ms
        multiplier: 2.0
        jitter: 0.5
      circuit-breaker:
        sliding-window-size: 20
        minimum-calls: 10
        failure-rate-percent: 50
        slow-call-threshold: 1500ms
        slow-call-rate-percent: 80
        open-duration: 15s
        half-open-calls: 3
      bulkhead:
        max-concurrent-calls: 16
        inquiry-max-concurrent-calls: 2
  reconciliation:
    # Continuous reconciliation (K4). Grace: records younger than this are in flight, not drift.
    interval-ms: ${PAYFLOW_RECONCILIATION_INTERVAL_MS:300000}
    grace: 2m
  payment:
    idempotency-retention: 24h
    idempotency-purge-interval: 1h
  fraud:
    decline-threshold: 70
    model-version: rules-v1
    velocity-window: 1h
    velocity-max-attempts: 10
    velocity-score: 40
    high-amount-score: 50
    high-amount-thresholds:
      USD: 10000
      EUR: 10000
      GBP: 8000
      INR: 800000
      JPY: 1500000
    missing-device-score: 15
    high-risk-countries: KP,IR
    high-risk-country-score: 70

---
# Kafka SASL/SCRAM (WP-03, ADR-023): the application authenticates as its own principal and is limited by broker ACLs.
# Credentials come from the environment (Secret), never from this file.
spring:
  config:
    activate:
      on-profile: kafka-sasl
  kafka:
    security:
      protocol: SASL_PLAINTEXT
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${PAYFLOW_KAFKA_USERNAME}" password="${PAYFLOW_KAFKA_PASSWORD}";

---
# Structured (ECS JSON) logs everywhere except local development and tests.
spring:
  config:
    activate:
      on-profile: "!local & !test"
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: payflow
