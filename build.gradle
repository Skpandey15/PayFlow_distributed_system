import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.payflow'
version = '0.1.0-SNAPSHOT'
description = 'PayFlow - modular monolith payment platform (WP-01 foundation, WP-02 event-driven, WP-03 resilience and scale)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '3.1.1'
    archunitVersion = '1.4.1'
    resilience4jVersion = '2.4.0'
    datasourceMicrometerVersion = '2.3.0'
    jsonSchemaValidatorVersion = '3.0.7'
}

configurations {
    // Mockito's inline mock maker needs its agent attached explicitly on JDK 21+ (JEP 451).
    mockitoAgent
}

dependencies {
    // All Spring-managed versions come from the Boot BOM; no hand-picked versions for managed libraries.
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    mockitoAgent platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    // Inbound adapter: HTTP
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Outbound adapters: PostgreSQL (authoritative financial state) + MongoDB (fraud evidence)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // WP-02 event backbone: Kafka (KRaft) via Spring Kafka; Outbox relay uses JDBC
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // WP-03 resilience at the synchronous remote boundary (settlement rails) only: core modules, wired explicitly
    // in the adapter's configuration (no annotations/AOP), metrics bound to Micrometer.
    // RestClient.Builder (observed: http.client.requests metrics + client spans) for the rail adapter
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation "io.github.resilience4j:resilience4j-circuitbreaker:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-retry:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-bulkhead:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-ratelimiter:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-micrometer:${resilience4jVersion}"

    // Zero Trust foundation: every request carries a verified JWT
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    // Observability foundation (full platform is WP-03): health/readiness probes, W3C trace-context
    // propagation and traceId/spanId in logs. Span export is off until WP-03 provides a collector.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // WP-03: Prometheus scrape endpoint (pull model; Prometheus authenticates with a client-credentials token)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // WP-03: JDBC spans in distributed traces (answers "where did the time go" inside a payment)
    implementation "net.ttddyy.observation:datasource-micrometer-spring-boot:${datasourceMicrometerVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation "com.networknt:json-schema-validator:${jsonSchemaValidatorVersion}"
    testImplementation 'org.awaitility:awaitility'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    // The settlement rail test double runs in-process in integration tests (real HTTP on a random port).
    testImplementation project(':rail-simulator')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters', '-Xlint:unchecked,deprecation']
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
    // Architecture, domain and integration tests all gate the build: a violated boundary fails CI.
}

tasks.named('bootJar') {
    archiveFileName = 'payflow.jar'
}

tasks.named('jar') {
    enabled = false
}
